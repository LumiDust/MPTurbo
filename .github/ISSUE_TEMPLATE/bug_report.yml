name: 问题反馈
description: 报告可复现的客户端或服务器问题。
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: TurboTick 与 RimWorld 完整版本
      placeholder: "TurboTick 0.3.0 / RimWorld 1.7.xxxx"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 包括客户端数量、服务器启动选项和相关模组。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图
      description: 先移除个人路径、账号信息及凭据。
