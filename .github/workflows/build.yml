name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1.7 = .NET 10
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 引用程序集来自 NuGet 的 Krafs.Rimworld.Ref（1.7 预发布线），不需要游戏本体
      - name: Build
        run: dotnet build Source/MPTurbo.csproj -c Release

      - name: Upload assembly
        uses: actions/upload-artifact@v4
        with:
          name: MPTurbo-1.7
          path: 1.7/Assemblies/MPTurbo.dll