name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $modVersion = ([xml](Get-Content About/About.xml -Raw)).ModMetaData.modVersion
          if ($version -ne $modVersion) { throw 'Mod and repository versions differ.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and source version differ.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build, protocol and CLI integration tests, installer tests, package validation
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload runtime packages
        uses: actions/upload-artifact@v4
        with:
          name: TurboTick-${{ steps.version.outputs.value }}-rimworld-1.7
          path: |
            artifacts/TurboTick-${{ steps.version.outputs.value }}-mod-1.7.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-server.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-headless-installer.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Publish stable GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: TurboTick ${{ steps.version.outputs.value }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            artifacts/TurboTick-${{ steps.version.outputs.value }}-mod-1.7.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-server.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-headless-installer.zip
            artifacts/SHA256SUMS
          body: |
            ## SteamCMD + headless 托管

            - 新增常驻游戏模拟、服务器检查点、空服继续运行与停服恢复。
            - SteamCMD 安装器支持原生 Steam Guard 交互、缓存登录、文件校验及未来专服的显式配置。
            - 修正联机 tick 间隔、路径请求和退出持久化；管理使用独立共享密码，不绑定首次创建者。
            - 仍采用锁步模拟；新玩家加入时会共同重载检查点。第三方模组和长期游玩需按组合验证。

            ## 下载与更新

            - `mod-1.7.zip`：客户端 Mod；所有玩家与 headless 服务端使用同一份包。
            - `headless-installer.zip`：同版 Mod、Windows/Linux SteamCMD 脚本及部署模板。
            - `server.zip`：原有独立 .NET 10 网络服务器。
            - `SHA256SUMS`：三个运行包的校验值。

            RimWorld 1.7；TurboTick ${{ steps.version.outputs.value }}；协议 v4。客户端与专服配套更新，旧版连接会被版本校验拦截。headless 服务端运行时的模组指纹也需随同版包更新。

            发布包不包含原版游戏、Harmony、源码、个人配置或部署记录。游戏和 Harmony 通过各自来源安装。

            [安装与使用](https://github.com/LumiDust/TurboTick#readme) · [headless 部署](https://github.com/LumiDust/TurboTick/blob/main/deploy/README.md)

            Docker（独立网络服）：`ghcr.io/lumidust/turbotick-server:${{ steps.version.outputs.value }}`；对应镜像由独立工作流构建。
