name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 引用程序集来自 NuGet 的 Krafs.Rimworld.Ref，不需要游戏本体
      - name: Build
        run: dotnet build Source/MPTurbo.csproj -c Release

      - name: Upload assembly
        uses: actions/upload-artifact@v4
        with:
          name: MPTurbo
          path: Assemblies/MPTurbo.dll
