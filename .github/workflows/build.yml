name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.Version
          $modVersion = ([xml](Get-Content About/About.xml -Raw)).ModMetaData.modVersion
          if ($version -ne $modVersion) { throw 'Mod and repository versions differ.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag and source version differ.' }
          $channel = ([xml](Get-Content Directory.Build.props -Raw)).Project.PropertyGroup.ReleaseChannel
          if ($channel -notin @('stable', 'preview')) { throw 'ReleaseChannel must be stable or preview.' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "channel=$channel" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build, protocol tests, installer tests and runtime packages
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload runtime packages
        uses: actions/upload-artifact@v4
        with:
          name: TurboTick-${{ steps.version.outputs.value }}-rimworld-1.7
          path: |
            artifacts/TurboTick-${{ steps.version.outputs.value }}-mod-1.7.zip
            artifacts/TurboTick-${{ steps.version.outputs.value }}-headless-installer.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  headless-container:
    needs: build-test-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TurboTick-${{ needs.build-test-package.outputs.version }}-rimworld-1.7
          path: artifacts/runtime-packages
      - name: Prepare the exact client release bytes for the image
        shell: bash
        env:
          VERSION: ${{ needs.build-test-package.outputs.version }}
        run: |
          set -euo pipefail
          cd artifacts/runtime-packages
          sha256sum -c SHA256SUMS
          cd ../..
          mkdir -p artifacts/container-mod
          unzip -q "artifacts/runtime-packages/TurboTick-$VERSION-mod-1.7.zip" -d artifacts/container-mod
          test -f artifacts/container-mod/TurboTick/1.7/Assemblies/TurboTick.dll
          test "$(find artifacts/container-mod -name '*.dll' | wc -l)" -eq 3
      - uses: docker/setup-buildx-action@v3
      - name: Build amd64 headless image without game or credentials
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: turbotick-headless:ci
          build-args: VERSION=${{ needs.build-test-package.outputs.version }}
          cache-from: type=gha,scope=headless
          cache-to: type=gha,mode=max,scope=headless
      - name: Container entrypoint and persistence contract tests
        shell: bash
        run: bash scripts/test-container.sh turbotick-headless:ci
      - name: Validate Compose configuration
        shell: bash
        run: docker compose config --quiet
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/turbotick-headless
          tags: |
            type=raw,value=${{ needs.build-test-package.outputs.version }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && needs.build-test-package.outputs.channel == 'stable' }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.version=${{ needs.build-test-package.outputs.version }}
      - name: Publish the tested headless image
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: VERSION=${{ needs.build-test-package.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=headless
          cache-to: type=gha,mode=max,scope=headless

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-test-package, headless-container]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TurboTick-${{ needs.build-test-package.outputs.version }}-rimworld-1.7
          path: artifacts
      - name: Publish GitHub release after package and image tests
        uses: softprops/action-gh-release@v2
        with:
          name: TurboTick ${{ needs.build-test-package.outputs.version }}
          draft: false
          prerelease: ${{ needs.build-test-package.outputs.channel == 'preview' }}
          make_latest: ${{ needs.build-test-package.outputs.channel == 'stable' }}
          fail_on_unmatched_files: true
          files: |
            artifacts/TurboTick-${{ needs.build-test-package.outputs.version }}-mod-1.7.zip
            artifacts/TurboTick-${{ needs.build-test-package.outputs.version }}-headless-installer.zip
            artifacts/SHA256SUMS
          body: |
            ## Headless 专服统一部署

            - 退役旧独立 .NET 网络服入口；共享协议和网络核心继续由 headless 宿主使用。
            - 新增 `turbotick-headless` 容器，安装与运行分开；运行容器不挂载 Steam 登录缓存，也不自动更新。
            - 镜像使用同次流水线的客户端 Mod 字节；游戏、Harmony、存档和认证缓存不进入公开镜像。
            - 详细部署说明覆盖 Steam Guard、目录权限、首次安装、启动、迁移、备份、升级与回滚。
            - 当前镜像仅支持 Linux amd64，原生 Windows/Linux 部署方式保留；游戏仍为客户端和服务器共同执行的锁步模型。

            本版为容器预览。容器安装/运行隔离、健康检查和退出流程已测试；新随机存档双端长跑仍出现锁步分叉，故障会挂起时间线。不要把容器健康视为任意存档长期一致的证明；先在独立数据目录验证，稳定版 latest 不随此预览更新。

            ## 下载

            - `mod-1.7.zip`：所有玩家和 headless 服务器使用的同版 Mod。
            - `headless-installer.zip`：同版 Mod、SteamCMD 脚本、Compose 和部署模板。
            - `SHA256SUMS`：两个运行包的校验值。

            Docker：`ghcr.io/lumidust/turbotick-headless:${{ needs.build-test-package.outputs.version }}`

            RimWorld 1.7；TurboTick ${{ needs.build-test-package.outputs.version }}；协议 v4。所有参与端更新为同一份包，并保持完整游戏 build、DLC、模组顺序及配置一致。历史 0.5.1 及更早附件与旧镜像保留用于回退，不再发布新的 `server.zip`。

            [安装与使用](https://github.com/LumiDust/TurboTick#readme) · [详细服务器部署](https://github.com/LumiDust/TurboTick/blob/main/deploy/README.md)
