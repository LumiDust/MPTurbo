name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build, integration tests, package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Upload mod and independent server
        uses: actions/upload-artifact@v4
        with:
          name: TurboTick-rimworld-1.7
          path: artifacts/*.zip
          if-no-files-found: error
